name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and policy checks
        run: bash tests/static.sh
      - name: ShellCheck
        run: shellcheck -S error -x cross.sh tests/*.sh scripts/*.sh
