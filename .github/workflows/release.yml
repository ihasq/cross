name: signed-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          sha256sum cross.sh > SHA256SUMS
          bash tests/static.sh
          bash tests/rollback-transaction.sh
          shellcheck -S error -x cross.sh tests/*.sh scripts/*.sh
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            cross.sh
            SHA256SUMS
      - name: Publish immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cross.sh SHA256SUMS --verify-tag --generate-notes
